{% load vartis_content %}
{% with form=lead_form %}
<form
  id="{{ form_id|default:'lead-form' }}"
  class="lead-form{% if form_variant == 'modal' %} lead-form--modal{% endif %}"
  method="post"
  action="{% url 'leads:submit' %}"
  hx-post="{% url 'leads:submit' %}"
  {% if form_variant == 'modal' %}
  hx-target="#modal-panel"
  hx-swap="innerHTML"
  aria-label="Форма заявки у вікні"
  {% else %}
  hx-target="this"
  hx-swap="outerHTML"
  {% endif %}
  novalidate
>
  {% csrf_token %}
  <input type="hidden" name="form_variant" value="{{ form_variant|default:'footer' }}">
  <input type="hidden" name="form_id" value="{{ form_id|default:'lead-form' }}">
  <input type="hidden" name="source_page" value="{{ request.path }}">
  {{ form.honeypot }}

  <label class="lead-form__label">{{ form.name.label }}
    {{ form.name }}
    <span class="lead-form__error">{{ form.name.errors|striptags }}</span>
  </label>

  <div class="lead-form__row">
    <label class="lead-form__label">{{ form.phone.label }}
      {{ form.phone }}
      <span class="lead-form__error">{{ form.phone.errors|striptags }}</span>
    </label>
    <label class="lead-form__label">{{ form.email.label }}
      {{ form.email }}
      <span class="lead-form__error">{{ form.email.errors|striptags }}</span>
    </label>
  </div>

  <label class="lead-form__label">{{ form.message.label }}
    {{ form.message }}
    <span class="lead-form__error">{{ form.message.errors|striptags }}</span>
  </label>

  <label class="lead-form__consent">
    {{ form.consent }}
    <span>
      {% block_plain 'site' 'form_consent_text' as consent_plain %}
      {% if consent_plain %}
        {% block_rich 'site' 'form_consent_text' %}
      {% else %}
        Погоджуюся на обробку персональних даних відповідно до <a href="{% url 'pages:privacy' %}">Політики
        конфіденційності</a>
      {% endif %}
    </span>
  </label>
  <span class="lead-form__error" data-error-for="consent">{{ form.consent.errors|striptags }}</span>

  <button type="submit" class="btn btn--primary">{% block_text 'site' 'form_submit_label' %}</button>
</form>
{% endwith %}
