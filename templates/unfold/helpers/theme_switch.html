{% load i18n %}

{% if not theme %}
    <div class="border-b border-base-200 flex flex-col gap-0.5 mb-1 pb-1 px-1 dark:border-base-700">
        <a class="cursor-pointer flex flex-row gap-2 min-w-0 px-3 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200"
           x-on:click="switchTheme('light')"
           x-bind:class="adminTheme == 'light'  && 'text-primary-600 dark:text-primary-500 dark:hover:text-primary-500! hover:text-primary-600!'">
            <span class="material-symbols-outlined shrink-0">light_mode</span>
            <span class="leading-none self-center">Світла</span>
        </a>

        <a class="cursor-pointer flex flex-row gap-2 min-w-0 leading-none px-3 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200"
           x-on:click="switchTheme('dark')"
           x-bind:class="adminTheme == 'dark' && 'text-primary-600 dark:text-primary-500 dark:hover:text-primary-500! hover:text-primary-600!'">
            <span class="material-symbols-outlined shrink-0">dark_mode</span>
            <span class="leading-none self-center">Темна</span>
        </a>

        <a class="cursor-pointer flex flex-row gap-2 min-w-0 px-3 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200"
           x-on:click="switchTheme('auto')"
           x-bind:class="adminTheme == 'auto' && 'text-primary-600 dark:text-primary-500 dark:hover:text-primary-500! hover:text-primary-600!'">
            <span class="material-symbols-outlined shrink-0">computer</span>
            <span class="leading-none self-center">Системна</span>
        </a>
    </div>
{% endif %}
