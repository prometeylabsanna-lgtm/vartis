<div class="flex flex-col gap-2 min-w-0 max-w-full vartis-url-field">
    {% include "django/forms/widgets/input.html" %}

    {% if url_valid %}
        <p class="text-xs vartis-url-field__current">
            {{ current_label }}
            <a href="{{ widget.href }}" class="text-primary-600 dark:text-primary-500 vartis-url-field__link" title="{{ widget.value }}">{{ widget.value }}</a>
        </p>
    {% endif %}
</div>
