<section class="section" aria-labelledby="nda-title">
  <div class="container">
    <div class="nda-card">
      <span class="nda-card__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </span>
      <div class="nda-card__body">
        <h2 id="nda-title" class="nda-card__title">{{ d.nda_title }}</h2>
        <p class="section__lead">{{ d.nda_text }}</p>
        <p class="nda-card__note">{{ d.nda_note }}</p>
      </div>
    </div>
  </div>
</section>

<section class="section" aria-labelledby="get-title">
  <div class="container">
    <div class="section__head">
      <h2 id="get-title" class="section__title">{{ d.get_title }}</h2>
      <p class="section__lead">{{ d.get_lead }}</p>
    </div>
    <div class="get-grid mt-40">
      {% for item in d.get_items %}
      <article class="get-card">
        <span class="get-card__num">{{ item.0 }}</span>
        <div>
          <h3 class="get-card__title">{{ item.1 }}</h3>
          <p class="get-card__text">{{ item.2 }}</p>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
