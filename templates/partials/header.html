{% load vartis_icons %}
<header id="site-header" class="site-header">
  <div class="site-header__inner">
    <div class="site-header__bar">
      <a href="{% url 'pages:home' %}" class="site-header__logo" aria-label="VARTIS INTELLIGENCE — на головну"></a>

      <nav class="site-header__nav" aria-label="Основна навігація">
        <a href="{% url 'pages:about' %}" class="site-header__link{% if request.resolver_match.url_name == 'about' %} is-active{% endif %}">Про компанію</a>
        <div class="svc-wrap" data-svc>
          <button type="button" class="svc-btn" data-action="toggle-svc" aria-expanded="false" aria-haspopup="true" aria-controls="svc-menu">
            Послуги
            <svg class="svc-btn__chev" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="#B58B4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <div id="svc-menu" class="svc-menu">
            <div class="svc-menu__panel">
              {% for s in nav_services %}
              <a href="{{ s.href }}" class="svc-menu__item" {% if request.path == s.href %}aria-current="page"{% endif %}>
                <span class="svc-menu__icon" aria-hidden="true">{% icon s.icon 30 %}</span>
                <span>
                  <span class="svc-menu__title">{{ s.title }}</span>
                  <span class="svc-menu__short">{{ s.short }}</span>
                </span>
                <svg width="18" height="18" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M5 17L17 5M17 5H8M17 5V14" stroke="#B58B4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </a>
              {% endfor %}
            </div>
          </div>
        </div>
        <a href="{% url 'blog:list' %}" class="site-header__link{% if request.resolver_match.app_name == 'blog' %} is-active{% endif %}">Блог</a>
        <a href="{% url 'pages:contacts' %}" class="site-header__link{% if request.resolver_match.url_name == 'contacts' %} is-active{% endif %}">Контакти</a>
      </nav>

      <button type="button" class="site-header__cta" data-action="open-form">Залишити заявку</button>

      <div class="site-header__actions">
        <button type="button" class="site-header__cta-tablet" data-action="open-form">Залишити заявку</button>
        <button type="button" class="burger" data-action="toggle-menu" aria-expanded="false" aria-controls="mobile-nav" aria-label="Відкрити меню">
          <span class="burger__bar"></span>
          <span class="burger__bar"></span>
          <span class="burger__bar"></span>
        </button>
      </div>
    </div>
  </div>
</header>
